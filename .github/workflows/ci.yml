name: PHP Syntax Lint & Security Tests

on:
  push:
    branches: [ main, security-review ]
  pull_request:
    branches: [ main, security-review ]

jobs:
  lint-and-test:
    name: Lint Syntax and Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, mbstring, json
          tools: composer:v2

      - name: Validate Composer Configuration
        run: composer validate --no-check-all

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run PHP Syntax Check (Lint All Source Files)
        run: |
          echo "Memulai pemeriksaan sintaksis PHP..."
          find . -type f -name "*.php" ! -path "./vendor/*" -exec php -l {} \;

      - name: Run Automated CSRF & Security Unit Tests
        run: |
          echo "Menjalankan unit test proteksi CSRF, autentikasi, dan sanitasi input..."
          php tests/test_unit_security.php
